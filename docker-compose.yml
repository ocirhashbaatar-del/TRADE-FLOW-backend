# Local development infrastructure only. Production uses managed PostgreSQL/Redis.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradeflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["tradeflow_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradeflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["tradeflow_redis:/data"]
volumes:
  tradeflow_postgres:
  tradeflow_redis:
